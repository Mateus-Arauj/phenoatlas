[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phenoatlas"
version = "0.1.0"
description = "Vegetation phenology extraction from remote sensing time-series - Python port of phenofit"
readme = "README.md"
license = { text = "GPL-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "phenoatlas contributors" }
]
keywords = ["phenology", "remote sensing", "vegetation", "time series", "NDVI", "EVI"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.10",
    "pandas>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[tool.hatch.version]
path = "phenoatlas/__init__.py"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
